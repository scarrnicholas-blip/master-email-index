# Entity aliases: landlord names as written in Housing Ombudsman decisions
# -> the stock entity whose homes form the denominator (RSH SDR for housing
# associations, LAHS for council-owned stock).
#
# Read by hos_pipeline.denominators.rsh.load_aliases. Matching is on the
# normalised name (case, punctuation, "Limited"/"Ltd"/"The" ignored), so list
# genuinely different spellings only.
#
# Fields per entity
#   canonical    label used in outputs
#   source       sdr | lahs: which stock file the entity lives in
#   stock_names  names to look for in that file, tried in order
#   entity_id    RSH registration number or ONS code; if it points to a different
#                row than stock_names, the match is flagged "alias_conflict" for review
#   reason       why the mapping holds (per entity, overridable per variant)
#   verify       true = check against the stock file / registers before publishing
#   period       {from, to}: decision dates the mapping applies to (null = always)
#   variants     HOS spellings; each may override reason, verify and period
#
# Period policy: merged_entity.
#   Predecessor landlords are mapped to the merged entity for every decision
#   date, and its stock is read from one post-merger snapshot (use an SDR as at
#   31 March 2024 or later, after all three mergers below). Counts and stock then
#   always describe the same organisation. The alternative, predecessor stock for
#   pre-merger decisions, needs one SDR per year: add variant entries with a
#   bounded `period` pointing at the predecessor, and load each year's SDR.
#
# ALMOs never owned their homes: the council did throughout, and LAHS counts
# ALMO-managed homes as council stock. So an ALMO maps to its council whatever
# the date it was brought back in-house. Multi-council ALMOs (e.g. East Kent
# Housing, which managed four councils' homes) are deliberately not mapped:
# their decisions need splitting by council by hand.

version: "2026-10-30"
period_policy: merged_entity

entities:
  # ---------------------------------------------------------------- mergers
  - canonical: Metropolitan Thames Valley Housing
    source: sdr
    stock_names:
      - Metropolitan Thames Valley Housing
      - Metropolitan Housing Trust Limited
    entity_id: null
    reason: >-
      Metropolitan Housing Trust and Thames Valley Housing Association merged in
      2018 to form Metropolitan Thames Valley Housing (MTVH).
    verify: true   # confirm the registered provider name MTVH files its SDR under
    period: null
    variants:
      - name: Metropolitan Thames Valley
      - name: MTVH
      - name: Metropolitan Housing Trust
        reason: Predecessor; merged with Thames Valley Housing Association into MTVH in 2018.
      - name: Thames Valley Housing Association
        reason: Predecessor; merged with Metropolitan Housing Trust into MTVH in 2018.
      - name: Thames Valley Housing
        reason: Predecessor; merged with Metropolitan Housing Trust into MTVH in 2018.

  - canonical: Southern Housing
    source: sdr
    stock_names:
      - Southern Housing
    entity_id: null
    reason: >-
      Formed December 2022 from Optivo and Southern Housing Group. Pre-merger
      decisions name a predecessor; under the merged_entity policy they count
      against the merged landlord's stock.
    verify: true   # confirm the SDR row name, and that a post-merger snapshot is used
    period: null
    variants:
      - name: Optivo
        reason: Predecessor; merged with Southern Housing Group in December 2022 to form Southern Housing.
      - name: Southern Housing Group
        reason: Predecessor; merged with Optivo in December 2022 to form Southern Housing.

  - canonical: Sovereign Network Group
    source: sdr
    stock_names:
      - Sovereign Network Group
      - Sovereign Network Homes
      - Sovereign Housing Association Limited
    entity_id: null
    reason: Sovereign Housing Association and Network Homes merged in 2023 to form Sovereign Network Group.
    verify: true   # confirm which registered provider(s) carry the stock in the SDR used
    period: null
    variants:
      - name: Sovereign Housing Association
        reason: Predecessor; merged with Network Homes in 2023 to form Sovereign Network Group.
      - name: Sovereign Housing
        reason: Predecessor; merged with Network Homes in 2023 to form Sovereign Network Group.
      - name: Network Homes
        reason: Predecessor; merged with Sovereign Housing Association in 2023 to form Sovereign Network Group.

